[project]
name = "elrobot-lerobot-training"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "lerobot[smolvla]==0.3.3",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchcodec==0.5.0",
    "av==14.2.0",
    "datasets==3.6.0",
    "huggingface-hub>=0.34.2,<1",
    "transformers>=4.50.3,<4.52",
    "pyyaml>=6,<7",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
