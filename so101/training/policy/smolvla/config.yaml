# SmolVLA fine-tune from lerobot/smolvla_base (LeRobot 0.6.x).
# GPU only — ~20k steps ≈ 4h on L40S. Cloud canary: --debug (500 steps).
#
# smolvla_base expects camera1/2/3. Pizza data is front + top (2 cams), so
# rename those views and pad the third slot with empty_cameras=1.

policy:
  path: lerobot/smolvla_base
  type: smolvla
  push_to_hub: false
  device: cuda
  freeze_vision_encoder: false
  train_expert_only: false
  empty_cameras: 1

rename_map:
  "observation.images.front": "observation.images.camera1"
  "observation.images.top": "observation.images.camera2"

dataset:
  repo_id: mnrozhkov/pizza_hack_v1_fake_ingredients

steps: 20000
batch_size: 8
log_freq: 50
save_freq: 2000

wandb:
  enable: true
  disable_artifact: true
  project: robotpizzacup
