# Diffusion policy (optional third path). Needs a mid-range GPU.

policy:
  type: diffusion
  push_to_hub: false
  device: cuda

dataset:
  repo_id: mnrozhkov/pizza_hack_v1_fake_ingredients

steps: 20000
batch_size: 8
log_freq: 50
save_freq: 5000

wandb:
  enable: true
  disable_artifact: true
  project: robotpizzacup
