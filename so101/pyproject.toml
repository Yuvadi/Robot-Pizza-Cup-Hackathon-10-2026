[project]
name = "pizza-robo-hack"
version = "0.1.0"
description = "Starter repo for the Robotics Pizza Hackathon: SO-101 + LeRobot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[core_scripts,training,feetech,smolvla,diffusion,pi,pusht]==0.6.1",
    "boto3>=1.35,<2",
    "pydantic>=2.6,<3",
    "rich>=13.7,<14",
    "typer>=0.12,<0.20",
]

[build-system]
requires = ["setuptools"]
backend-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["training*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = ["ruff>=0.8,<0.15"]
